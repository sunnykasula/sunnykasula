<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sai Vardhan Reddy K, Full Stack AI Engineer</title>
  <desc id="d">Profile banner. On the right, a small diagram shows a Java API passing requests to an agent, which calls an LLM, tools and data.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#8A97AD" opacity="0.22"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
    <clipPath id="panel"><rect x="612" y="40" width="352" height="220" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Arial,sans-serif}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{fill-opacity:0}}
    @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0D1420"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#26324A"/>

  <!-- left: identity -->
  <text x="56" y="62" class="mono" font-size="14" fill="#2DD4BF">~/sai-vardhan <tspan fill="#8A97AD">$</tspan><tspan fill="#EEF2F7"> whoami</tspan><tspan class="cursor" fill="#F5A524"> ▌</tspan></text>

  <text x="54" y="138" class="sans" font-size="48" font-weight="800" letter-spacing="-1" fill="#EEF2F7">Sai Vardhan Reddy K</text>
  <text x="56" y="182" class="sans" font-size="26" font-weight="600" fill="#F5A524">Full Stack AI Engineer</text>
  <text x="56" y="214" class="sans" font-size="15" fill="#8A97AD">Java backends, AI agents, and the integrations between them.</text>

  <g class="mono" font-size="12.5" text-anchor="middle">
    <rect x="56" y="238" width="56" height="26" rx="13" fill="#F5A524" fill-opacity="0.10" stroke="#F5A524" stroke-opacity="0.7"/>
    <text x="84" y="255" fill="#F5A524">Java</text>
    <rect x="122" y="238" width="94" height="26" rx="13" fill="#2DD4BF" fill-opacity="0.10" stroke="#2DD4BF" stroke-opacity="0.7"/>
    <text x="169" y="255" fill="#2DD4BF">AI Agents</text>
    <rect x="226" y="238" width="50" height="26" rx="13" fill="none" stroke="#26324A"/>
    <text x="251" y="255" fill="#8A97AD">AWS</text>
    <rect x="286" y="238" width="102" height="26" rx="13" fill="none" stroke="#26324A"/>
    <text x="337" y="255" fill="#8A97AD">Databricks</text>
  </g>

  <!-- right: request flow -->
  <rect x="612" y="40" width="352" height="220" rx="14" fill="#141D2E" stroke="#26324A"/>
  <rect x="612" y="40" width="352" height="220" rx="14" fill="url(#grid)" clip-path="url(#panel)"/>

  <g class="mono" font-size="11" fill="#8A97AD">
    <rect x="634" y="62" width="9" height="9" rx="2" fill="#F5A524"/>
    <text x="649" y="70.5">Java code</text>
    <rect x="726" y="62" width="9" height="9" rx="2" fill="#2DD4BF"/>
    <text x="741" y="70.5">Agent</text>
  </g>

  <g fill="none" stroke="#26324A" stroke-width="1.6">
    <path d="M720 151 H752"/>
    <path d="M838 151 C855 151 855 98 872 98"/>
    <path d="M838 151 H872"/>
    <path d="M838 151 C855 151 855 204 872 204"/>
  </g>

  <g class="mono" font-size="12.5" text-anchor="middle">
    <rect x="634" y="131" width="86" height="40" rx="8" fill="#0D1420" stroke="#F5A524"/>
    <text x="677" y="155.5" fill="#EEF2F7">Java API</text>
    <rect x="752" y="131" width="86" height="40" rx="8" fill="#0D1420" stroke="#2DD4BF"/>
    <text x="795" y="155.5" fill="#EEF2F7" font-weight="700">Agent</text>
    <rect x="872" y="78" width="74" height="40" rx="8" fill="#0D1420" stroke="#26324A"/>
    <text x="909" y="102.5" fill="#EEF2F7">LLM</text>
    <rect x="872" y="131" width="74" height="40" rx="8" fill="#0D1420" stroke="#26324A"/>
    <text x="909" y="155.5" fill="#EEF2F7">Tools</text>
    <rect x="872" y="184" width="74" height="40" rx="8" fill="#0D1420" stroke="#26324A"/>
    <text x="909" y="208.5" fill="#EEF2F7">Data</text>
  </g>

  <!-- the one moving part: a request travelling API -> agent -> tools -->
  <circle r="3.4" fill="#F5A524"><animateMotion dur="1.6s" repeatCount="indefinite" path="M720 151 H752"/></circle>
  <circle r="3.4" fill="#2DD4BF"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M838 151 C855 151 855 98 872 98"/></circle>
  <circle r="3.4" fill="#2DD4BF"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M838 151 H872"/></circle>
  <circle r="3.4" fill="#2DD4BF"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M838 151 C855 151 855 204 872 204"/></circle>
</svg>
