<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="Pixel-art illustration of Sai's night coding setup: back view at an ultrawide monitor, headphones on, city skyline through the window, shelves with a clock and books, a PC tower with pink RGB fans, a bonsai plant and a lava lamp">
<defs>
  <style>
    @keyframes flicker { 0%,100%{opacity:1;} 50%{opacity:.55;} }
    @keyframes blink2 { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
    @keyframes lavaMove { 0%,100%{ cy:600; ry:26;} 50%{ cy:566; ry:20;} }
    @keyframes lavaMove2 { 0%,100%{ cy:640; ry:18;} 50%{ cy:610; ry:24;} }
    @keyframes screenShift { 0%,100%{opacity:.55;} 50%{opacity:.85;} }
    @keyframes fanspin2 { 0%{opacity:.6} 50%{opacity:1} 100%{opacity:.6} }
    .flicker{animation:flicker 3.4s ease-in-out infinite;}
    .win{animation:blink2 2.6s step-end infinite;}
    .lava1{animation:lavaMove 5s ease-in-out infinite;}
    .lava2{animation:lavaMove2 6.5s ease-in-out infinite;}
    .scr{animation:screenShift 4s ease-in-out infinite;}
    .fan{animation:fanspin2 1.6s ease-in-out infinite;}
    @media (prefers-reduced-motion:reduce){ .flicker,.win,.lava1,.lava2,.scr,.fan{animation:none!important;} }
  </style>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#232a52"/><stop offset="100%" stop-color="#171b38"/>
  </linearGradient>
  <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#121530"/><stop offset="100%" stop-color="#0a0c1f"/>
  </linearGradient>
  <linearGradient id="deskP" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4a3a2c"/><stop offset="100%" stop-color="#382c20"/>
  </linearGradient>
  <linearGradient id="scrGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c9fbf3"/><stop offset="100%" stop-color="#5eead4"/>
  </linearGradient>
</defs>

<!-- ROOM SHELL -->
<rect x="0" y="0" width="1400" height="800" fill="url(#wall)"/>
<rect x="0" y="560" width="1400" height="240" fill="url(#floor2)"/>
<rect x="0" y="552" width="1400" height="8" fill="#0d1030"/>

<!-- LEFT WINDOW -->
<g>
  <rect x="40" y="60" width="560" height="500" fill="#04060f"/>
  <rect x="40" y="60" width="560" height="500" fill="none" stroke="#3a4270" stroke-width="10"/>
  <!-- city -->
  <g>
    <rect x="60" y="360" width="60" height="180" fill="#141a34"/>
    <rect x="130" y="300" width="46" height="240" fill="#191f42"/>
    <rect x="184" y="400" width="70" height="140" fill="#0f1329"/>
    <rect x="264" y="260" width="52" height="280" fill="#191f42"/>
    <rect x="326" y="340" width="60" height="200" fill="#141a34"/>
    <rect x="396" y="220" width="56" height="320" fill="#1c2348"/>
    <rect x="462" y="380" width="62" height="160" fill="#0f1329"/>
    <rect x="534" y="300" width="50" height="240" fill="#191f42"/>
    <g fill="#ffe27a">
      <rect class="win" x="72" y="380" width="8" height="8" style="animation-delay:.2s"/>
      <rect class="win" x="90" y="410" width="8" height="8" style="animation-delay:1.4s"/>
      <rect class="win" x="146" y="330" width="8" height="8" style="animation-delay:.6s"/>
      <rect class="win" x="146" y="380" width="8" height="8" style="animation-delay:1s"/>
      <rect class="win" x="200" y="430" width="8" height="8" style="animation-delay:.3s"/>
      <rect class="win" x="280" y="300" width="8" height="8" style="animation-delay:.9s"/>
      <rect class="win" x="280" y="350" width="8" height="8" style="animation-delay:1.8s"/>
      <rect class="win" x="342" y="380" width="8" height="8" style="animation-delay:.4s"/>
      <rect class="win" x="414" y="260" width="8" height="8" style="animation-delay:1.2s"/>
      <rect class="win" x="414" y="320" width="8" height="8" style="animation-delay:.1s"/>
      <rect class="win" x="480" y="410" width="8" height="8" style="animation-delay:.7s"/>
      <rect class="win" x="550" y="340" width="8" height="8" style="animation-delay:1.6s"/>
    </g>
    <!-- moon -->
    <circle cx="500" cy="130" r="26" fill="#fdf3d6"/>
    <circle cx="490" cy="122" r="4" fill="#e9dcae"/>
    <circle cx="510" cy="140" r="3" fill="#e9dcae"/>
  </g>
  <!-- blinds -->
  <g stroke="#5a6294" stroke-width="3" opacity="0.55">
    <line x1="40" y1="90" x2="600" y2="90"/><line x1="40" y1="112" x2="600" y2="112"/>
    <line x1="40" y1="134" x2="600" y2="134"/><line x1="40" y1="156" x2="600" y2="156"/>
  </g>
  <rect x="590" y="86" width="6" height="150" fill="#5a6294" opacity="0.6"/>
  <!-- sash -->
  <rect x="316" y="60" width="8" height="500" fill="#3a4270"/>
  <rect x="40" y="308" width="560" height="8" fill="#3a4270"/>
</g>

<!-- small pixel plant bottom-left of window -->
<g transform="translate(20,540)">
  <rect x="10" y="30" width="34" height="24" fill="#2a2038"/>
  <rect x="10" y="30" width="34" height="6" fill="#3a2c4a"/>
  <rect x="18" y="-10" width="8" height="40" fill="#2f9e6e"/>
  <rect x="26" y="-22" width="8" height="52" fill="#38b57f"/>
  <rect x="34" y="-4" width="8" height="34" fill="#4ecb92"/>
  <rect x="6" y="-14" width="8" height="44" fill="#2f9e6e"/>
</g>

<!-- WALL SHELVES (right of window, above desk) -->
<g transform="translate(640,90)">
  <!-- shelf 1 -->
  <rect x="0" y="76" width="470" height="10" fill="#4a3a2c"/>
  <rect x="-4" y="86" width="8" height="16" fill="#4a3a2c"/><rect x="466" y="86" width="8" height="16" fill="#4a3a2c"/>
  <rect x="6" y="8" width="18" height="66" fill="#2a2038"/>
  <rect x="30" y="14" width="52" height="46" fill="#141a34" stroke="#3a4270" stroke-width="3"/>
  <circle cx="56" cy="37" r="10" fill="#5a2f6e"/><circle cx="50" cy="30" r="3" fill="#f472b6"/>
  <rect x="90" y="18" width="34" height="58" fill="#1c2140" stroke="#3a4270" stroke-width="3"/>
  <rect x="132" y="26" width="30" height="50" fill="#1c2140" stroke="#3a4270" stroke-width="3"/>
  <rect x="330" y="16" width="14" height="60" fill="#3fae7c"/>
  <rect x="344" y="22" width="14" height="54" fill="#e8ecf6"/>
  <path d="M366 76 C 356 56 356 30 372 8 C 378 30 376 56 384 76 Z" fill="#2f9e6e"/>
  <rect x="410" y="36" width="90" height="12" fill="#12b6b0" opacity="0.85"/>
  <circle cx="416" cy="42" r="4" fill="#0d1030"/><circle cx="494" cy="42" r="4" fill="#0d1030"/>

  <!-- shelf 2 -->
  <rect x="0" y="176" width="470" height="10" fill="#4a3a2c"/>
  <rect x="-4" y="186" width="8" height="16" fill="#4a3a2c"/><rect x="466" y="186" width="8" height="16" fill="#4a3a2c"/>
  <rect x="10" y="126" width="90" height="46" fill="#0a0c1f" stroke="#3a4270" stroke-width="3"/>
  <text x="20" y="156" font-family="monospace" font-size="26" font-weight="700" fill="#ff5470">01:17</text>
  <rect x="120" y="112" width="10" height="60" fill="#e8ecf6"/>
  <rect x="132" y="118" width="10" height="54" fill="#dcd6c8"/>
  <rect x="144" y="106" width="10" height="66" fill="#e8ecf6"/>
  <rect x="156" y="122" width="10" height="50" fill="#c8c2b4"/>
  <rect x="200" y="118" width="52" height="58" rx="4" fill="#e6e6ea" stroke="#9aa0b6" stroke-width="3"/>
  <rect x="214" y="130" width="24" height="10" fill="#1c2140"/>
  <circle cx="380" cy="150" r="20" fill="#f0c199"/>
  <rect x="366" y="160" width="28" height="16" fill="#2a2038"/>
  <rect x="366" y="130" width="28" height="22" fill="#1c2140"/>
</g>

<!-- AMBIENT GLOWS -->
<circle cx="900" cy="480" r="260" fill="#5eead4" opacity="0.10"/>
<circle cx="1150" cy="520" r="180" fill="#f472b6" opacity="0.10"/>
<circle cx="780" cy="430" r="200" fill="#a78bfa" opacity="0.08"/>

<!-- DESK -->
<rect x="600" y="600" width="700" height="22" fill="url(#deskP)"/>
<rect x="622" y="622" width="18" height="120" fill="#241a10"/>
<rect x="1258" y="622" width="18" height="120" fill="#241a10"/>

<!-- MONITOR -->
<g transform="translate(760,380)">
  <rect x="-14" y="-14" width="368" height="220" fill="#0a0c1f" stroke="#3a4270" stroke-width="8"/>
  <rect x="0" y="0" width="340" height="192" fill="url(#scrGlow)"/>
  <g class="scr" fill="#0a2a2a" opacity="0.7">
    <rect x="18" y="16" width="130" height="8"/><rect x="18" y="34" width="200" height="8"/>
    <rect x="18" y="52" width="90" height="8"/><rect x="18" y="70" width="160" height="8"/>
    <rect x="18" y="88" width="220" height="8"/><rect x="18" y="106" width="120" height="8"/>
    <rect x="18" y="124" width="180" height="8"/><rect x="18" y="142" width="100" height="8"/>
    <rect x="18" y="160" width="150" height="8"/>
  </g>
  <rect x="150" y="212" width="40" height="18" fill="#1c2140"/>
  <rect x="120" y="230" width="100" height="10" fill="#0a0c1f"/>
</g>

<!-- ROUTER + EQ + MUG on desk -->
<g transform="translate(650,568)">
  <rect x="0" y="0" width="76" height="20" rx="3" fill="#1c2140" stroke="#3a4270" stroke-width="2"/>
  <circle class="flicker" cx="10" cy="10" r="2.4" fill="#4ade80"/>
  <circle class="flicker" cx="20" cy="10" r="2.4" fill="#4ade80" style="animation-delay:.5s"/>
  <circle class="flicker" cx="30" cy="10" r="2.4" fill="#fbbf24" style="animation-delay:1s"/>
</g>
<g transform="translate(650,600)" fill="#4ade80">
  <rect x="0" y="18" width="6" height="10"/><rect x="10" y="10" width="6" height="18"/>
  <rect x="20" y="4" width="6" height="24"/><rect x="30" y="14" width="6" height="14"/>
  <rect x="40" y="0" width="6" height="28"/>
</g>
<g transform="translate(1140,590)">
  <rect x="0" y="8" width="26" height="24" fill="#e8ecf6"/>
  <path d="M26 12 h10 a8 8 0 0 1 0 16 h-10 Z" fill="none" stroke="#e8ecf6" stroke-width="4"/>
</g>

<!-- PERSON (from behind, headphones, at desk) -->
<g transform="translate(940,760)">
  <ellipse cx="0" cy="16" rx="120" ry="18" fill="#000000" opacity="0.3"/>
  <!-- chair -->
  <rect x="-70" y="-210" width="140" height="150" rx="16" fill="#161a30"/>
  <rect x="-14" y="-60" width="28" height="70" fill="#161a30"/>
  <path d="M-40 10 L-70 90 M40 10 L70 90" stroke="#161a30" stroke-width="14" stroke-linecap="round"/>
  <!-- body -->
  <rect x="-58" y="-236" width="116" height="90" rx="14" fill="#12141f"/>
  <!-- arms to desk -->
  <path d="M-52 -220 C -78 -195 -84 -165 -70 -150 L-52 -156 C -60 -172 -54 -192 -34 -206 Z" fill="#12141f"/>
  <path d="M52 -220 C 78 -195 84 -165 70 -150 L52 -156 C 60 -172 54 -192 34 -206 Z" fill="#12141f"/>
  <!-- head -->
  <circle cx="0" cy="-286" r="34" fill="#1c1730"/>
  <path d="M-34 -286 a34 34 0 0 1 68 0 C 26 -312 -26 -312 -34 -286Z" fill="#0f0c1c"/>
  <!-- headphones -->
  <path d="M-30 -292 C -30 -324 30 -324 30 -292" fill="none" stroke="#0a0c1f" stroke-width="8"/>
  <rect x="-37" y="-296" width="12" height="20" rx="4" fill="#0a0c1f"/>
  <rect x="25" y="-296" width="12" height="20" rx="4" fill="#0a0c1f"/>
</g>

<!-- AC unit on wall (top right) -->
<g transform="translate(1160,50)">
  <rect x="0" y="0" width="200" height="34" rx="4" fill="#dfe3ee"/>
  <rect x="10" y="24" width="180" height="5" fill="#aeb6cc"/>
  <circle cx="186" cy="10" r="3" fill="#ff5470"/>
</g>

<!-- SECOND WINDOW (right) -->
<g transform="translate(1250,70)">
  <rect x="0" y="0" width="130" height="220" fill="#04060f" stroke="#3a4270" stroke-width="8"/>
  <path d="M10 220 C 20 140 60 120 70 40 C 90 120 110 160 120 220 Z" fill="#0e1a12" opacity="0.85"/>
  <g fill="#ffe27a" opacity="0.7">
    <rect class="win" x="20" y="60" width="6" height="6" style="animation-delay:.9s"/>
    <rect class="win" x="100" y="90" width="6" height="6" style="animation-delay:.2s"/>
  </g>
</g>

<!-- PC TOWER with pink RGB fans -->
<g transform="translate(1080,596)">
  <rect x="0" y="0" width="70" height="150" rx="6" fill="#12141f" stroke="#2a2f4a" stroke-width="3"/>
  <circle class="fan" cx="35" cy="30" r="19" fill="none" stroke="#f6549e" stroke-width="5"/>
  <circle class="fan" cx="35" cy="75" r="19" fill="none" stroke="#f6549e" stroke-width="5" style="animation-delay:.3s"/>
  <circle class="fan" cx="35" cy="120" r="19" fill="none" stroke="#f6549e" stroke-width="5" style="animation-delay:.6s"/>
  <circle cx="35" cy="30" r="4" fill="#f6549e"/><circle cx="35" cy="75" r="4" fill="#f6549e"/><circle cx="35" cy="120" r="4" fill="#f6549e"/>
</g>

<!-- bonsai plant near PC -->
<g transform="translate(1180,590)">
  <rect x="10" y="70" width="60" height="40" rx="4" fill="#3a2c1e"/>
  <path d="M40 70 C 30 40 45 10 40 -20" stroke="#5a4632" stroke-width="8" fill="none"/>
  <ellipse cx="30" cy="-24" rx="34" ry="18" fill="#2f9e6e"/>
  <ellipse cx="58" cy="-6" rx="26" ry="14" fill="#38b57f"/>
  <ellipse cx="44" cy="16" rx="22" ry="12" fill="#4ecb92"/>
</g>

<!-- media console + lava lamp (far right) -->
<g transform="translate(1300,640)">
  <rect x="0" y="40" width="100" height="70" fill="#241a10"/>
  <rect x="0" y="34" width="100" height="10" fill="#3a2c1e"/>
  <rect x="20" y="-70" width="16" height="70" fill="#2a2038"/>
  <rect x="8" y="-84" width="40" height="16" rx="6" fill="#2a2038"/>
  <ellipse class="lava1" cx="28" cy="-40" rx="10" ry="22" fill="#f6549e" opacity="0.9"/>
  <ellipse class="lava2" cx="28" cy="-58" rx="7" ry="16" fill="#ff8fc2" opacity="0.8"/>
  <rect x="16" y="-96" width="24" height="14" rx="3" fill="#3a2c1e"/>
</g>

</svg>
