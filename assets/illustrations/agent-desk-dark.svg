<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Animated illustration of Sai at a night workstation building a multi-agent AI workflow, with a city skyline outside the window">
<style>
  .cloud{animation:drift 70s linear infinite;}
  .cloud.c2{animation-duration:95s;animation-delay:-20s;}
  @keyframes drift{from{transform:translateX(-40px);}to{transform:translateX(60px);}}
  .moon-glow{animation:pulseSoft 6s ease-in-out infinite;}
  @keyframes pulseSoft{0%,100%{opacity:.85;}50%{opacity:1;}}
  .win-lit{animation:winBlink 5s ease-in-out infinite;}
  @keyframes winBlink{0%,40%,100%{opacity:.55;}45%,55%{opacity:.12;}}
  .steam{animation:steamRise 3.6s ease-in-out infinite;transform-origin:bottom center;}
  @keyframes steamRise{0%{opacity:0;transform:translateY(0) scaleY(.6);}30%{opacity:.55;}100%{opacity:0;transform:translateY(-14px) scaleY(1.15);}}
  .fan-blades{animation:spin 4s linear infinite;transform-origin:center;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .led{animation:ledBlink 2.4s ease-in-out infinite;}
  @keyframes ledBlink{0%,100%{opacity:.25;}50%{opacity:1;}}
  .rgb-strip{animation:rgbShift 6s ease-in-out infinite;}
  @keyframes rgbShift{0%,100%{stop-color:#5eead4;}33%{stop-color:#a78bfa;}66%{stop-color:#fb923c;}}
  .agent-node{animation:nodePulse 3.2s ease-in-out infinite;}
  @keyframes nodePulse{0%,100%{opacity:.65;r:var(--r,5);}50%{opacity:1;r:calc(var(--r,5) * 1.25);}}
  .agent-particle{animation:travel 2.4s linear infinite;offset-rotate:0deg;}
  @keyframes travel{0%{offset-distance:0%;opacity:0;}8%{opacity:1;}92%{opacity:1;}100%{offset-distance:100%;opacity:0;}}
  .code-scroll{animation:codeScroll 9s linear infinite;}
  @keyframes codeScroll{0%{transform:translateY(0);}100%{transform:translateY(-64px);}}
  .cursor-move{animation:cursorMove 6s ease-in-out infinite;}
  @keyframes cursorMove{0%,100%{transform:translate(0,0);}25%{transform:translate(70px,10px);}50%{transform:translate(30px,34px);}75%{transform:translate(90px,4px);}}
  .monitor-glow{animation:pulseSoft 5s ease-in-out infinite;}
  .status-cycle{animation:statusCycle 9s ease-in-out infinite;}
  @keyframes statusCycle{0%{opacity:0;}4%{opacity:1;}30%{opacity:1;}34%{opacity:0;}100%{opacity:0;}}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#080b16"/><stop offset="55%" stop-color="#101731"/><stop offset="100%" stop-color="#161f3f"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#161d38"/><stop offset="100%" stop-color="#0a0e1e"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0e2f3a"/><stop offset="100%" stop-color="#0a1a2c"/>
  </linearGradient>
  <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a2c22"/><stop offset="100%" stop-color="#2b2018"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/><stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moon" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/><stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rgbLine" x1="0" y1="0" x2="0" y2="1">
    <stop class="rgb-strip" offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
</defs>

