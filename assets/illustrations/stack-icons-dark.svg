      <ellipse rx="20" ry="8" fill="none" stroke="#61DAFB" stroke-width="2.6" transform="rotate(60)"/>
      <ellipse rx="20" ry="8" fill="none" stroke="#61DAFB" stroke-width="2.6" transform="rotate(120)"/>
