    <circle cx="42" cy="24" r="3" fill="#EE4C2C"/>
    <text class="lbl" x="42" y="74">PyTorch</text>
  </g>

  <!-- Databricks -->
  <g class="tile-g" transform="translate(196,0)" style="--c:#FF3621">
