    <g transform="translate(24,26)" fill="#2496ED">
      <rect x="0" y="0" width="12" height="10"/><rect x="14" y="0" width="12" height="10"/><rect x="28" y="0" width="12" height="10"/>
      <rect x="14" y="-12" width="12" height="10"/><rect x="28" y="-12" width="12" height="10"/>
      <rect x="0" y="12" width="12" height="10"/><rect x="14" y="12" width="12" height="10"/><rect x="28" y="12" width="12" height="10"/>
    </g>
    <path transform="translate(24,26)" d="M-4 24c8 8 40 8 48-2 6-8 4-18 4-18" fill="none" stroke="#2496ED" stroke-width="3" stroke-linecap="round"/>
