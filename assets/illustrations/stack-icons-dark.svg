    <g transform="translate(38,32)">
      <rect x="-14" y="-16" width="22" height="28" rx="2" fill="none" stroke="#22D3EE" stroke-width="2.6"/>
      <line x1="-10" y1="-8" x2="0" y2="-8" stroke="#22D3EE" stroke-width="2"/>
      <line x1="-10" y1="-2" x2="0" y2="-2" stroke="#22D3EE" stroke-width="2"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="#22D3EE" stroke-width="2.6"/>
      <line x1="17" y1="17" x2="23" y2="23" stroke="#22D3EE" stroke-width="2.8" stroke-linecap="round"/>
