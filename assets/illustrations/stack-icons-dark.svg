<svg viewBox="0 0 770 182" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grid of technology icons: Java, Spring Boot, React, PostgreSQL, Python, LangChain, LangGraph, RAG, Anthropic, PyTorch, Databricks, Jupyter, AWS, Google Cloud, Docker, Git">
<defs>
  <style>
    .tile{fill:#12141f;stroke:#262f4d;stroke-width:1.5;}
    .lbl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;fill:#8d99bd;text-anchor:middle;}
    .tile-g:hover .tile{stroke:var(--c);}
  </style>
</defs>

<!-- row 1 -->
<g font-family="IBM Plex Mono, monospace">

  <!-- Java -->
  <g class="tile-g" transform="translate(0,0)" style="--c:#ED8B00">
    <rect class="tile" x="0" y="0" width="84" height="84" rx="14"/>
    <g transform="translate(42,36)">
      <path d="M-13 4h26v11a13 13 0 0 1-13 13 13 13 0 0 1-13-13Z" fill="none" stroke="#ED8B00" stroke-width="3.4"/>
      <path d="M13 8h6a6.5 6.5 0 0 1 0 13h-6" fill="none" stroke="#ED8B00" stroke-width="3"/>
      <path d="M-7 -8c0 2.4-3 2.6-3 5M2 -8c0 2.4-3 2.6-3 5" stroke="#ED8B00" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <text class="lbl" x="42" y="74">Java</text>
  </g>

  <!-- Spring Boot -->
  <g class="tile-g" transform="translate(98,0)" style="--c:#6DB33F">
    <rect class="tile" x="0" y="0" width="84" height="84" rx="14"/>
    <path transform="translate(42,32)" d="M17 -13C-2 -13-13-2-13 17c8 0 13-8 13-16-1 12 4 21 15 23 11-9 8-25 2-37Z" fill="none" stroke="#6DB33F" stroke-width="3.2" stroke-linejoin="round"/>
    <text class="lbl" x="42" y="74">Spring Boot</text>
