<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 110" width="700" height="110" role="img" aria-labelledby="t d">
    <title id="t">Languages across my repositories</title>
    <desc id="d">Two language badges: Python and Jupyter Notebook.</desc>
    <defs>
          <linearGradient id="edge" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#22D3EE"/>
                  <stop offset="50%" stop-color="#A78BFA"/>
                  <stop offset="100%" stop-color="#F472B6"/>
          </linearGradient>
          <style>
                  .mono{font-family:'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
          </style>
    </defs>
    <rect width="700" height="110" rx="14" fill="#10142A" stroke="url(#edge)" stroke-opacity="0.7"/>
    <text x="24" y="34" class="mono" font-size="13" fill="#8B9BC7">Languages across my repos</text>

    <g class="mono" font-size="13.5" text-anchor="middle">
          <rect x="24" y="54" width="120" height="34" rx="17" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.85"/>
          <circle cx="42" cy="71" r="5" fill="#38BDF8"/>
          <text x="93" y="75.5" fill="#BAE6FD">Python</text>

          <rect x="156" y="54" width="212" height="34" rx="17" fill="#FB923C" fill-opacity="0.14" stroke="#FB923C" stroke-opacity="0.85"/>
          <circle cx="174" cy="71" r="5" fill="#FB923C"/>
          <text x="263" y="75.5" fill="#FED7AA">Jupyter Notebook</text>
    </g>
</svg>
